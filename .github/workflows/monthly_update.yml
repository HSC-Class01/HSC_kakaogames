name: Monthly DART update and dashboard deploy

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: samsung-dart-pipeline
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile opendart_agent.py test_agent.py

      - name: Run tests
        run: python -m pytest -q

      - name: Fetch and analyze OpenDART data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python opendart_agent.py

      - name: Ensure dashboard data files exist
        run: |
          test -s data/financials.csv
          test -s data/ratios.csv
          test -s data/filings.csv
          test -s index.html

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data raw
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh Samsung DART data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
