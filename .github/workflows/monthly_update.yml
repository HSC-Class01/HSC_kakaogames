name: Kakao Games DART update and GitHub Pages deploy

on:
  schedule:
    - cron: "15 0 1 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/monthly_update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kakaogames-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate collector syntax
        run: python -m py_compile scripts/update.py test_agent.py
      - name: Run smoke tests
        run: python -m unittest test_agent.py
      - name: Collect DART financial statements and calculate ratios
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/update.py
      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/processed/financials.json")
          assert p.is_file() and p.stat().st_size > 100
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data.get("company") == "카카오게임즈"
          assert isinstance(data.get("records"), list)
          print(f"validated {len(data['records'])} report records")
          PY
      - name: Commit refreshed source data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Kakao Games DART data"
            git push
          else
            echo "No data changes."
          fi
      - name: Build clean agent ZIP (no hidden paths)
        run: |
          rm -rf package dist
          mkdir -p package/scripts package/docs package/workflows dist
          cp scripts/update.py package/scripts/update.py
          cp docs/index.html package/docs/index.html
          cp README.md package/README.md
          cp requirements.txt package/requirements.txt
          cp test_agent.py package/test_agent.py
          cp .github/workflows/monthly_update.yml package/workflows/monthly_update.yml
          cp data/processed/financials.json package/financials-latest.json
          (cd package && zip -r ../dist/HSC_kakaogames_agent.zip .)
          python - <<'PY'
          import zipfile
          p = "dist/HSC_kakaogames_agent.zip"
          with zipfile.ZipFile(p) as z:
              names = z.namelist()
              assert names and all(not n.startswith(".") and "/." not in n for n in names), names
              print(f"clean ZIP validated: {len(names)} files")
          PY
      - name: Upload clean agent ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HSC_kakaogames-agent-clean-zip
          path: dist/HSC_kakaogames_agent.zip
          if-no-files-found: error
          retention-days: 90
      - name: Prepare Pages artifact
        run: |
          rm -rf site
          mkdir -p site/data/processed
          cp docs/index.html site/index.html
          cp data/processed/financials.json site/data/processed/financials.json
          test -s site/index.html
          test -s site/data/processed/financials.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
